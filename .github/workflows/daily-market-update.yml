name: Daily market data update

on:
  schedule:
    # 17:15 Asia/Shanghai on weekdays, after the futures day session and the
    # public EOD providers have had time to publish.
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-update-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Refresh EOD bars, governed main contracts, and features
        run: python -m scheduler.update_daily --start 20200101
      - name: Generate structured daily report
        run: python -m scheduler.daily_report
      - name: Commit refreshed research data when it changed
        run: |
          git config user.name "commodity-quant-bot"
          git config user.email "commodity-quant-bot@users.noreply.github.com"
          git add data/raw/provider_continuous data/raw/contracts data/raw/official data/daily data/feature_store reports/daily reports/data_quality
          git diff --cached --quiet || git commit -m "data: refresh daily commodity research"
          git push
